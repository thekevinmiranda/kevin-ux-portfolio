<svg width="960" height="1200" viewBox="0 0 960 1200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="jt-title jt-desc">
  <title id="jt-title">The self-taught design journey</title>
  <desc id="jt-desc">A progression through three stages: Graphic Design, Web Design &amp; Development, and UI/UX Design &amp; Development.</desc>

  <rect x="0" y="0" width="960" height="1200" fill="#F4F1E8"/>

  <!-- ============================== RAIL ============================== -->
  <line x1="480" y1="150" x2="480" y2="830" stroke="#DCD6C6" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- connecting arrows -->
  <path d="M465,438 L495,438 L480,464 Z" fill="#58685F"/>
  <path d="M465,778 L495,778 L480,804 Z" fill="#58685F"/>

  <!-- rail nodes -->
  <circle cx="480" cy="150" r="14" fill="#F4F1E8" stroke="#E6A017" stroke-width="7"/>
  <circle cx="480" cy="490" r="14" fill="#F4F1E8" stroke="#E6A017" stroke-width="7"/>
  <circle cx="480" cy="830" r="14" fill="#F4F1E8" stroke="#E6A017" stroke-width="7"/>

  <!-- ======================= STAGE 1 — GRAPHIC DESIGN ======================= -->
  <g>
    <rect x="390" y="160" width="180" height="200" rx="16" fill="#ECE7D9" stroke="#14231C" stroke-width="6"/>
    <rect x="402" y="176" width="156" height="48" fill="#F6E4B4"/>
    <rect x="402" y="232" width="156" height="48" fill="#E6A017"/>
    <rect x="402" y="288" width="156" height="48" fill="#C0810A"/>
  </g>
  <text x="480" y="420" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" letter-spacing="1.5" fill="#8A600D" text-anchor="middle">GRAPHIC DESIGN</text>

  <!-- =================== STAGE 2 — WEB DESIGN &amp; DEV =================== -->
  <g>
    <rect x="360" y="500" width="240" height="200" rx="14" fill="#ECE7D9" stroke="#14231C" stroke-width="6"/>
    <rect x="372" y="508" width="216" height="28" rx="6" fill="#F4F1E8"/>
    <circle cx="390" cy="522" r="6" fill="#C0810A"/>
    <circle cx="408" cy="522" r="6" fill="#E6A017"/>
    <circle cx="426" cy="522" r="6" fill="#58685F"/>
    <rect x="384" y="556" width="192" height="50" rx="6" fill="#DCD6C6"/>
    <rect x="384" y="618" width="192" height="14" rx="7" fill="#DCD6C6"/>
    <rect x="384" y="642" width="130" height="14" rx="7" fill="#DCD6C6"/>
  </g>
  <text x="480" y="760" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" letter-spacing="1.5" fill="#8A600D" text-anchor="middle">WEB DESIGN &amp; DEV</text>

  <!-- ===================== STAGE 3 — UI/UX DESIGN &amp; DEV ===================== -->
  <g>
    <rect x="390" y="840" width="180" height="200" rx="26" fill="#ECE7D9" stroke="#14231C" stroke-width="6"/>
    <rect x="450" y="854" width="60" height="8" rx="4" fill="#DCD6C6"/>
    <rect x="406" y="882" width="148" height="68" rx="10" fill="#F6E4B4"/>
    <rect x="406" y="966" width="148" height="40" rx="20" fill="#E6A017" stroke="#14231C" stroke-width="4"/>
    <path d="M456,986 L472,1002 L504,970" stroke="#14231C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="480" y="1100" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" letter-spacing="1.5" fill="#8A600D" text-anchor="middle">UI/UX DESIGN &amp; DEV</text>
</svg>
