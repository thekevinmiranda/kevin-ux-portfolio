<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="p13-title p13-desc">
  <title id="p13-title">My Design Process</title>
  <desc id="p13-desc">A six-phase flow: Discover, Diagnose, Ideate, Validate, Build, Ship.</desc>

  <rect x="0" y="0" width="800" height="600" fill="#F4F1E8"/>

  <!-- ============================================== CONNECTORS ============================================== -->
  <!-- row 1, left to right -->
  <path d="M262,178 L288,190 L262,202 Z" fill="#58685F"/>
  <path d="M512,178 L538,190 L512,202 Z" fill="#58685F"/>
  <!-- down connector -->
  <path d="M638,298 L650,324 L662,298 Z" fill="#58685F"/>
  <!-- row 2, right to left -->
  <path d="M538,418 L512,430 L538,442 Z" fill="#58685F"/>
  <path d="M288,418 L262,430 L288,442 Z" fill="#58685F"/>

  <!-- ============================================== ROW 1 ============================================== -->
  <!-- 01 Discover -->
  <g>
    <circle cx="150" cy="190" r="52" fill="#F4F1E8" stroke="#14231C" stroke-width="7"/>
    <g transform="translate(128,168) scale(1.833333)" fill="none" stroke="#14231C" stroke-width="1.8">
      <circle cx="10" cy="10" r="6"/>
      <path d="M14.5 14.5L19 19" stroke-linecap="round"/>
    </g>
  </g>
  <text x="150" y="270" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="21" letter-spacing="1" fill="#8A600D" text-anchor="middle">01 &#183; DISCOVER</text>

  <!-- 02 Diagnose (AI-assisted) -->
  <g>
    <circle cx="400" cy="190" r="52" fill="#F6E4B4" stroke="#C0810A" stroke-width="7"/>
    <g transform="translate(378,168) scale(1.833333)" fill="none" stroke="#14231C" stroke-width="1.6">
      <circle cx="12" cy="12" r="8"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="12" cy="12" r="1" fill="#14231C"/>
    </g>
  </g>
  <text x="400" y="270" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="21" letter-spacing="1" fill="#8A600D" text-anchor="middle">02 &#183; DIAGNOSE</text>

  <!-- 03-04 Ideate (AI-assisted) -->
  <g>
    <circle cx="650" cy="190" r="52" fill="#F6E4B4" stroke="#C0810A" stroke-width="7"/>
    <g transform="translate(628,168) scale(1.833333)" fill="none" stroke="#14231C" stroke-width="1.6">
      <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3 11.2c.6.4 1 1.1 1 1.8h4c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3Z" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="650" y="270" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="21" letter-spacing="1" fill="#8A600D" text-anchor="middle">03-04 &#183; IDEATE</text>

  <!-- ============================================== ROW 2 ============================================== -->
  <!-- 05-09 Validate (AI-assisted) -->
  <g>
    <circle cx="650" cy="430" r="52" fill="#F6E4B4" stroke="#C0810A" stroke-width="7"/>
    <g transform="translate(628,408) scale(1.833333)" fill="none" stroke="#14231C" stroke-width="1.6">
      <path d="M4 5h16v11H9l-4 4V5Z" stroke-linejoin="round"/>
      <path d="M8.5 10.5l2 2 4-4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="650" y="510" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="21" letter-spacing="1" fill="#8A600D" text-anchor="middle">05-09 &#183; VALIDATE</text>

  <!-- 10-12 Build -->
  <g>
    <circle cx="400" cy="430" r="52" fill="#F4F1E8" stroke="#14231C" stroke-width="7"/>
    <g transform="translate(378,408) scale(1.833333)" fill="none" stroke="#14231C" stroke-width="1.8">
      <path d="M9 8l-4 4 4 4M15 8l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <text x="400" y="510" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="21" letter-spacing="1" fill="#8A600D" text-anchor="middle">10-12 &#183; BUILD</text>

  <!-- 13 Ship -->
  <g>
    <circle cx="150" cy="430" r="52" fill="#F4F1E8" stroke="#14231C" stroke-width="7"/>
    <g transform="translate(128,408) scale(1.833333)" fill="none" stroke="#14231C" stroke-width="1.6">
      <path d="M21 3 3 10.5l7.5 2.5L13 21l3-5.5L21 3Z" stroke-linejoin="round"/>
      <path d="M21 3l-8.5 8.5" stroke-linecap="round"/>
    </g>
  </g>
  <text x="150" y="510" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="21" letter-spacing="1" fill="#8A600D" text-anchor="middle">13 &#183; SHIP</text>
</svg>
