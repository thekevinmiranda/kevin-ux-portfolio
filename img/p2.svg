<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ph-title-p2 ph-desc-p2">
  <title id="ph-title-p2">My Workspace — placeholder image</title>
  <desc id="ph-desc-p2">A placeholder graphic showing the project title, standing in until a real product screenshot is added.</desc>

  <rect x="0" y="0" width="800" height="600" fill="#ECE7D9"/>

  <!-- big faint number watermark -->
  <text x="-18" y="470" font-family="'Bricolage Grotesque', ui-serif, Georgia, serif" font-weight="800" font-size="360" fill="#14231C" opacity="0.05">02</text>

  <!-- thin frame -->
  <rect x="18" y="18" width="764" height="564" fill="none" stroke="#DCD6C6" stroke-width="2"/>

  <!-- eyebrow -->
  <g transform="translate(400,207)">
    <rect x="-13" y="-2" width="26" height="3" fill="#E6A017"/>
    <text x="0" y="24" font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="2.5" fill="#8A600D" text-anchor="middle">PRODUCT · DASHBOARD</text>
  </g>

  <!-- title -->
  <text x="400" y="318" font-family="'Bricolage Grotesque', ui-serif, Georgia, serif" font-weight="700" font-size="58" fill="#14231C" text-anchor="middle">
    <tspan x="400" dy="0">My Workspace</tspan>
  </text>
</svg>
